name: Check studio
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm test
        working-directory: studio
      - run: npm run build
        working-directory: studio
